[workspace]
authors = ["lee dongwon <dlehddnjs245@khu.ac.kr>"]
channels = ["conda-forge"]
name = "longvideo-kv"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "==3.12.3"
pytorch-gpu = ">=2.12,<2.13"
torchvision = ">=0.27,<0.28"
flash-attn = "==2.8.3"
accelerate = "==1.14.0"
huggingface_hub = "==1.8.0"
fsspec = "==2026.6.0"
numpy = "==2.2.6"
pandas = "==2.3.1"
psutil = "==7.0.0"
pyyaml = "==6.0.2"
safetensors = "==0.8.0"
transformers = "==5.15.0"
ffmpeg = ">=6,<7"

[pypi-dependencies]
av = "==15.1.0"
decord2 = "==3.4.0"
pyarrow = "==25.0.1"
qwen-vl-utils = "==0.0.14"
torchcodec = "==0.13.0"
lmms-eval = { path = "third-party/lmms-eval", editable = true }

[system-requirements]
cuda = "13.0"

[activation.env]
PYTHONNOUSERSITE = "1"
PYTHONPATH = ""
